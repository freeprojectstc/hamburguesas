<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos — Hamburguesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b1b1f;
    --panel:#242429;
    --paper:#fbf3df;
    --paper-shadow:#e3d7b8;
    --mustard:#e8a93a;
    --red:#c1442d;
    --ink:#2b2620;
    --ok:#4c7a51;
    --muted:#8a8a92;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--paper);
    font-family:'Space Mono', monospace;
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-space-between;
    padding:18px 28px;
    border-bottom:2px dashed #3a3a42;
  }
  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:1px;
    font-size:clamp(22px,4vw,34px);
    margin:0;
    color:var(--mustard);
    text-transform:uppercase;
  }
  .tabs{
    display:flex;
    gap:8px;
    background:var(--panel);
    padding:4px;
    border-radius:10px;
  }
  .tab{
    border:none;
    background:transparent;
    color:var(--muted);
    font-family:'Anton', sans-serif;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:13px;
    padding:10px 18px;
    border-radius:8px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .tab.active{
    background:var(--red);
    color:#fff2e6;
  }
  main{ padding:24px 28px 60px; }
  .hidden{ display:none !important; }

  /* CAJA */
  .caja-grid{
    display:grid;
    grid-template-columns:1.3fr 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:820px){ .caja-grid{ grid-template-columns:1fr; } }

  .menu-card{
    background:var(--panel);
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
  }
  .menu-card h2{
    font-family:'Anton', sans-serif;
    font-weight:400;
    color:var(--mustard);
    text-transform:uppercase;
    letter-spacing:0.5px;
    font-size:16px;
    margin:0 0 12px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #34343c;
  }
  .item-row:last-child{ border-bottom:none; }
  .item-name{ font-size:14px; }
  .item-price{ color:var(--muted); font-size:12px; display:block; }
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .stepper button{
    width:28px;height:28px;
    border-radius:50%;
    border:none;
    background:#3a3a42;
    color:var(--paper);
    font-size:16px;
    cursor:pointer;
    line-height:1;
  }
  .stepper button:hover{ background:var(--red); }
  .stepper span{ min-width:16px; text-align:center; font-size:14px; }

  input[type=text], textarea{
    width:100%;
    background:#1b1b1f;
    border:1px solid #3a3a42;
    color:var(--paper);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Space Mono', monospace;
    font-size:14px;
  }
  textarea{ resize:vertical; min-height:60px; }
  label.field-label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color:var(--muted);
    margin-bottom:6px;
  }

  /* Ticket */
  .ticket{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:20px 20px 28px;
    position:sticky;
    top:20px;
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .ticket::before{
    content:"";
    display:block;
    height:10px;
    margin:-20px -20px 14px;
    background:
      linear-gradient(-45deg, var(--bg) 6px, transparent 0) 0 0/12px 12px,
      linear-gradient(45deg, var(--bg) 6px, transparent 0) 0 0/12px 12px;
    background-color:var(--paper);
    background-repeat:repeat-x;
  }
  .ticket h3{
    font-family:'Anton', sans-serif;
    font-weight:400;
    text-transform:uppercase;
    font-size:18px;
    margin:0 0 4px;
    border-bottom:2px dashed var(--paper-shadow);
    padding-bottom:10px;
  }
  .ticket .sub{ font-size:11px; color:#6b6152; margin-bottom:14px; }
  .ticket-line{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    padding:4px 0;
  }
  .ticket-empty{ font-size:13px; color:#8a7f68; font-style:italic; padding:10px 0; }
  .send-btn{
    width:100%;
    margin-top:16px;
    padding:14px;
    background:var(--red);
    color:#fff2e6;
    border:none;
    border-radius:8px;
    font-family:'Anton', sans-serif;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:15px;
    cursor:pointer;
  }
  .send-btn:disabled{ background:#6b6152; cursor:not-allowed; }
  .send-btn:not(:disabled):hover{ background:#a3391f; }

  /* COCINA */
  .cocina-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:20px;
  }
  .order-ticket{
    background:var(--paper);
    color:var(--ink);
    border-radius:4px;
    padding:16px 16px 18px;
    box-shadow:0 10px 22px rgba(0,0,0,.3);
    position:relative;
  }
  .order-ticket.listo{ opacity:0.45; }
  .order-ticket::before{
    content:"";
    display:block;
    height:9px;
    margin:-16px -16px 12px;
    background:
      linear-gradient(-45deg, var(--bg) 5.5px, transparent 0) 0 0/11px 11px,
      linear-gradient(45deg, var(--bg) 5.5px, transparent 0) 0 0/11px 11px;
    background-color:var(--paper);
    background-repeat:repeat-x;
  }
  .order-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:2px dashed var(--paper-shadow);
    padding-bottom:8px;
    margin-bottom:10px;
  }
  .order-num{ font-family:'Anton', sans-serif; font-size:20px; }
  .order-time{ font-size:11px; color:#6b6152; }
  .order-table{ font-size:12px; color:#6b6152; margin-bottom:8px; }
  .order-item{ font-size:14px; padding:3px 0; }
  .order-note{
    font-size:12px;
    color:var(--red);
    margin-top:8px;
    font-style:italic;
  }
  .ready-btn{
    width:100%;
    margin-top:14px;
    padding:10px;
    background:var(--ok);
    color:#fff;
    border:none;
    border-radius:6px;
    font-family:'Anton', sans-serif;
    letter-spacing:0.5px;
    text-transform:uppercase;
    font-size:13px;
    cursor:pointer;
  }
  .ready-btn:hover{ background:#3d6141; }
  .empty-state{
    grid-column:1/-1;
    text-align:center;
    padding:60px 20px;
    color:var(--muted);
    font-size:14px;
  }
  .empty-state strong{
    display:block;
    font-family:'Anton', sans-serif;
    color:var(--mustard);
    font-size:22px;
    margin-bottom:8px;
    text-transform:uppercase;
  }
</style>
</head>
<body>

<header>
  <h1>🍔 La Esquina de la Hamburguesa</h1>
  <div class="tabs">
    <button class="tab active" data-view="caja">Caja</button>
    <button class="tab" data-view="cocina">Cocina</button>
  </div>
</header>

<main>
  <!-- VISTA CAJA -->
  <section id="view-caja">
    <div class="caja-grid">
      <div>
        <div class="menu-card">
          <h2>Hamburguesas</h2>
          <div id="menu-burgers"></div>
        </div>
        <div class="menu-card">
          <h2>Extras</h2>
          <div id="menu-extras"></div>
        </div>
        <div class="menu-card">
          <h2>Hot Dog</h2>
          <div id="menu-hotdogs"></div>
        </div>
        <div class="menu-card">
          <label class="field-label" for="mesa">Mesa / Cliente</label>
          <input type="text" id="mesa" placeholder="Mesa 4 / Juan">
          <div style="height:12px"></div>
          <label class="field-label" for="nota">Nota para cocina (opcional)</label>
          <textarea id="nota" placeholder="Sin cebolla, término medio, etc."></textarea>
        </div>
      </div>

      <div class="ticket">
        <h3>Pedido actual</h3>
        <div class="sub">Se envía a cocina en tiempo real via Firebase</div>
        <div id="ticket-lines"></div>
        <button class="send-btn" id="send-btn" disabled>Enviar a cocina</button>
      </div>
    </div>
  </section>

  <!-- VISTA COCINA -->
  <section id="view-cocina" class="hidden">
    <div class="cocina-grid" id="cocina-grid"></div>
  </section>
</main>

<!-- LIBRERÍAS DE FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<script>
// TUS CREDENCIALES EXACTAS DE FIREBASE INTEGRADAS
const firebaseConfig = {
  apiKey: "AIzaSyB6w9L_gJLfRro36hR3XunyY6_als74-TM",
  authDomain: "hamburguesas-bbad0.firebaseapp.com",
  databaseURL: "https://hamburguesas-bbad0-default-rtdb.firebaseio.com",
  projectId: "hamburguesas-bbad0",
  storageBucket: "hamburguesas-bbad0.firebasestorage.app",
  messagingSenderId: "350370569405",
  appId: "1:350370569405:web:cb9a8ea474bf6af8912bd4"
};

// Inicializar Firebase
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const pedidosRef = db.ref('pedidos');

const MENU = {
  burgers: [
    { id:'sencilla', name:'Hamburguesa sencilla', price:70 },
    { id:'especial', name:'Hamburguesa Especial',  price:85 },
  ],
  extras: [
    { id:'pina',       name:'Piña',         price:10 },
    { id:'tocino',     name:'Tocino',       price:10 },
    { id:'doblecarne', name:'Doble Carne',  price:30 },
    { id:'papas',      name:'Papas',        price:45 },
  ],
  hotdogs: [
    { id:'hotdog',        name:'Hot Dog',             price:25 },
    { id:'hotdog-tocino', name:'Hot Dog con Tocino',  price:30 },
  ]
};

let currentOrder = {};
let allOrders = [];
let currentView = 'caja';
let nextNum = 1;

function money(n){ return '$' + n.toFixed(0); }

function renderMenu(){
  const bWrap = document.getElementById('menu-burgers');
  const eWrap = document.getElementById('menu-extras');
  const hWrap = document.getElementById('menu-hotdogs');
  bWrap.innerHTML = MENU.burgers.map(rowHTML).join('');
  eWrap.innerHTML = MENU.extras.map(rowHTML).join('');
  hWrap.innerHTML = MENU.hotdogs.map(rowHTML).join('');

  function rowHTML(item){
    return `
      <div class="item-row">
        <div>
          <span class="item-name">${item.name}</span>
          <span class="item-price">${money(item.price)}</span>
        </div>
        <div class="stepper">
          <button onclick="changeQty('${item.id}',-1)">−</button>
          <span id="qty-${item.id}">${currentOrder[item.id]||0}</span>
          <button onclick="changeQty('${item.id}',1)">+</button>
        </div>
      </div>`;
  }
}

function allItems(){ return [...MENU.burgers, ...MENU.extras, ...MENU.hotdogs]; }
function findItem(id){ return allItems().find(i=>i.id===id); }

function changeQty(id, delta){
  const val = Math.max(0, (currentOrder[id]||0) + delta);
  if(val === 0) delete currentOrder[id];
  else currentOrder[id] = val;
  document.getElementById('qty-'+id).textContent = val;
  renderTicket();
}

function renderTicket(){
  const wrap = document.getElementById('ticket-lines');
  const ids = Object.keys(currentOrder);
  if(ids.length === 0){
    wrap.innerHTML = '<div class="ticket-empty">Todavía no hay artículos. Agrega algo del menú.</div>';
  } else {
    wrap.innerHTML = ids.map(id=>{
      const item = findItem(id);
      const qty = currentOrder[id];
      return `<div class="ticket-line"><span>${qty}× ${item.name}</span><span>${money(item.price*qty)}</span></div>`;
    }).join('');
  }
  document.getElementById('send-btn').disabled = ids.length === 0;
}

// Guardar pedido en Firebase
function sendOrder(){
  const ids = Object.keys(currentOrder);
  if(ids.length === 0) return;

  const items = ids.map(id=>{
    const item = findItem(id);
    return { name:item.name, qty:currentOrder[id] };
  });

  const newOrderRef = pedidosRef.push();
  const order = {
    id: newOrderRef.key,
    num: nextNum++,
    table: document.getElementById('mesa').value.trim() || 'Sin mesa',
    note: document.getElementById('nota').value.trim(),
    items,
    status: 'pendiente',
    time: Date.now(),
  };

  newOrderRef.set(order).then(() => {
    currentOrder = {};
    document.getElementById('mesa').value = '';
    document.getElementById('nota').value = '';
    renderMenu();
    renderTicket();
  }).catch(err => alert("Error al guardar pedido: " + err.message));
}

function timeAgo(ts){
  const mins = Math.floor((Date.now()-ts)/60000);
  if(mins < 1) return 'ahora mismo';
  if(mins === 1) return 'hace 1 min';
  return `hace ${mins} min`;
}

function renderCocina(){
  const grid = document.getElementById('cocina-grid');
  const sorted = [...allOrders].sort((a,b)=>{
    if(a.status !== b.status) return a.status === 'pendiente' ? -1 : 1;
    return a.time - b.time;
  });

  if(sorted.length === 0){
    grid.innerHTML = `<div class="empty-state"><strong>Sin pedidos</strong>Los pedidos de caja aparecerán aquí al instante.</div>`;
    return;
  }

  grid.innerHTML = sorted.map(order=>`
    <div class="order-ticket ${order.status==='listo'?'listo':''}">
      <div class="order-head">
        <span class="order-num">#${order.num}</span>
        <span class="order-time">${timeAgo(order.time)}</span>
      </div>
      <div class="order-table">${order.table}</div>
      ${order.items.map(it=>`<div class="order-item">${it.qty}× ${it.name}</div>`).join('')}
      ${order.note ? `<div class="order-note">"${order.note}"</div>` : ''}
      ${order.status==='pendiente'
        ? `<button class="ready-btn" onclick="markReady('${order.id}')">Marcar listo</button>`
        : `<div style="text-align:center;font-size:12px;color:#4c7a51;margin-top:12px;">✓ Listo</div>`}
    </div>
  `).join('');
}

// Marcar como listo en Firebase
function markReady(id){
  pedidosRef.child(id).update({ status: 'listo' });
}

// Escuchar cambios en tiempo real mediante WebSockets de Firebase
pedidosRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if(!data){
    allOrders = [];
  } else {
    allOrders = Object.values(data);
  }
  const maxNum = allOrders.reduce((m,o)=>Math.max(m,o.num||0), 0);
  nextNum = Math.max(nextNum, maxNum+1);
  if(currentView === 'cocina') renderCocina();
});

function switchView(view){
  currentView = view;
  document.getElementById('view-caja').classList.toggle('hidden', view!=='caja');
  document.getElementById('view-cocina').classList.toggle('hidden', view!=='cocina');
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===view));
  if(view === 'cocina') renderCocina();
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>switchView(t.dataset.view));
});
document.getElementById('send-btn').addEventListener('click', sendOrder);

renderMenu();
renderTicket();
</script>
</body>
</html>
